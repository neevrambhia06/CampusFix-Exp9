# ============================
# CampusFix Spring Boot Config
# ============================

# Server port — uses PORT env var from Render, defaults to 8080 locally
server.port=${PORT:8080}

# Application name
spring.application.name=campusfix-backend

# ============================
# Database Configuration
# ============================

# Default: H2 in-memory database (local development)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:campusfix}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (only for local development)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ============================
# CORS Configuration
# ============================
campusfix.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================
# Logging
# ============================
logging.level.com.campusfix=INFO
logging.level.org.springframework.web=INFO
